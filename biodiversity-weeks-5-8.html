<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 Biodiversity for Sustainability — Weeks 5–8</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#111827;--muted:#6b7280;--border:#e5e7eb;--shadow:0 4px 12px rgba(0,0,0,.05);--green:#118a3a;--red:#c0262d;--button:#111827}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:1500px;margin:0 auto;padding:24px 18px 40px}header{text-align:center;padding:6px 0 20px}
h1{font-size:clamp(30px,3.8vw,52px);line-height:1.1;margin:8px 0 6px;font-weight:800;color:#000}
.subtitle{margin:0 auto;max-width:900px;color:var(--muted);font-size:14px}
.toolbar{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:18px 0 24px}
button,.link-btn{appearance:none;border:0;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn-primary{background:var(--button);color:#fff}.btn-secondary{background:#e5e7eb;color:#111827}
.meta{text-align:center;margin:0 0 18px;color:var(--muted);font-size:14px}
form{display:grid;gap:18px}.question-card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);border:1px solid #f0f0f0;padding:18px 18px 14px}
.qtop{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:10px}
.qtitle{font-size:18px;line-height:1.55;margin:0;font-weight:500}
.week-badge{flex:0 0 auto;font-size:12px;background:#eef2ff;color:#3730a3;padding:6px 10px;border-radius:999px;font-weight:700}
.options{display:grid;gap:8px;margin-top:4px}label.opt{display:flex;gap:10px;align-items:flex-start;font-size:16px;line-height:1.45;cursor:pointer}
label.opt input{margin-top:4px;transform:scale(1.05)}.result{margin-top:12px;font-weight:700;min-height:24px;font-size:15px}
.correct{color:var(--green)}.wrong{color:var(--red)}.scorebox{margin-top:20px;padding:16px 18px;background:#fff;border:1px solid #e5e7eb;border-radius:14px;box-shadow:var(--shadow);font-size:18px;font-weight:800;text-align:center}
.scoredetails{display:block;margin-top:8px;font-size:14px;color:var(--muted);font-weight:600}
.sticky-submit{position:sticky;bottom:14px;z-index:5;display:flex;justify-content:center;margin-top:10px}
.sticky-submit button{box-shadow:0 10px 24px rgba(0,0,0,.12)}
@media(max-width:700px){.qtitle{font-size:17px}label.opt{font-size:15px}.question-card{padding:16px 14px 12px}}
</style></head>
<body><div class="wrap"><header><h1>2026 Biodiversity for Sustainability</h1>
<p class="subtitle">Interactive quiz for Weeks 5–8 with shuffled questions, shuffled options, instant scoring, and correct/wrong feedback after submission.</p></header>
<div class="toolbar"><a class="link-btn btn-secondary" href="./index.html">Home</a><button class="btn-primary" type="button" onclick="submitQuiz()">Submit</button><button class="btn-secondary" type="button" onclick="resetQuiz()">Reset</button></div>
<div class="meta" id="metaLine"></div><form id="quizForm"></form>
<div class="sticky-submit"><button class="btn-primary" type="button" onclick="submitQuiz()">Submit</button></div>
<div class="scorebox" id="scoreBox">Submit the quiz to see your score.</div></div>
<script>
const quizData=[{"week": 5, "q": "What is human–wildlife conflict?", "options": ["A situation where wildlife needs or behaviour clash with human interests and lead to damage, fear, injury, loss, or retaliation", "Any peaceful interaction between humans and wildlife", "The presence of wildlife in a landscape without any cost", "A condition where all species remain inside protected areas"], "answer": "A situation where wildlife needs or behaviour clash with human interests and lead to damage, fear, injury, loss, or retaliation"}, {"week": 5, "q": "Why can a protected area alone fail to secure a species over time?", "options": ["Protected areas always reduce biodiversity", "Species cannot survive inside reserves", "Human activity is absent around all reserves", "Many species move beyond reserves for food, water, mates, or seasonal habitat"], "answer": "Many species move beyond reserves for food, water, mates, or seasonal habitat"}, {"week": 5, "q": "What is option value in biodiversity valuation?", "options": ["The value of replacing ecosystems with infrastructure", "The value of using only one species now", "The benefit of keeping biodiversity available for possible future uses", "The cost of removing biodiversity from markets"], "answer": "The benefit of keeping biodiversity available for possible future uses"}, {"week": 5, "q": "What are examples of non-timber forest products?", "options": ["Fruits, nuts, resins, medicinal plants, bamboo, and fibres", "Roads, drains, fences, and bridges", "Coal, cement, steel, and petroleum", "Cars, buildings, markets, and pipelines"], "answer": "Fruits, nuts, resins, medicinal plants, bamboo, and fibres"}, {"week": 5, "q": "What is microclimate regulation by vegetation?", "options": ["Reducing heat stress by shade, lower surface temperatures, and humidity influence", "Increasing heat stress by removing tree cover", "Preventing all seasonal variation in climate", "Replacing water regulation with pest regulation"], "answer": "Reducing heat stress by shade, lower surface temperatures, and humidity influence"}, {"week": 5, "q": "Which set represents cultural services of biodiversity?", "options": ["Flood control, pollination, soil structure, and carbon storage", "Recreation, inspiration, education, heritage, and shared public spaces", "Crop raiding, livestock loss, property damage, and fear", "Compensation, insurance, fences, and early warnings"], "answer": "Recreation, inspiration, education, heritage, and shared public spaces"}, {"week": 5, "q": "What is a major limitation of fortress thinking in conservation?", "options": ["Not all biodiversity can be isolated from people", "It gives too much importance to shared landscapes", "It ignores the need for protected areas altogether", "It assumes people and wildlife must always interact directly"], "answer": "Not all biodiversity can be isolated from people"}, {"week": 5, "q": "How does biodiversity help regulate water in a landscape?", "options": ["By stopping rainfall from entering the soil", "By increasing surface runoff in simplified landscapes", "By influencing infiltration, storage, and runoff through vegetation, roots, and living soils", "By eliminating wetlands from human-used areas"], "answer": "By influencing infiltration, storage, and runoff through vegetation, roots, and living soils"}, {"week": 5, "q": "Which factor can make coexistence difficult?", "options": ["Perfectly equal sharing of all conservation costs", "Inadequate planning of roads, settlements, farms, or infrastructure", "Complete absence of ecological uncertainty", "Guaranteed support from all institutions"], "answer": "Inadequate planning of roads, settlements, farms, or infrastructure"}, {"week": 5, "q": "How can biodiversity support physical health?", "options": ["By increasing polluted water flow", "By removing all disease risk permanently", "By replacing all healthcare systems", "By filtering pollutants, improving air and water quality, and supporting stable ecological regulation"], "answer": "By filtering pollutants, improving air and water quality, and supporting stable ecological regulation"}, {"week": 6, "q": "Which species concept defines species mainly by niche, resources, and environmental conditions used?", "options": ["Evolutionary species concept", "Ecological species concept", "Biological species concept", "Morphological species concept"], "answer": "Ecological species concept"}, {"week": 6, "q": "Habitat quality depends mainly on:", "options": ["Legal status alone", "Whether the habitat appears on a map", "Food, water, shelter, breeding sites, and low disturbance", "Whether only one species is present"], "answer": "Food, water, shelter, breeding sites, and low disturbance"}, {"week": 6, "q": "Genetic diversity refers to:", "options": ["Variation in hereditary information among individuals and populations", "Difference in species composition between two ecosystems", "Number of habitats across a landscape", "Number of visible traits in a field guide"], "answer": "Variation in hereditary information among individuals and populations"}, {"week": 6, "q": "A biodiversity hotspot combines which three features?", "options": ["High rainfall, high elevation, and high productivity", "High abundance, low disturbance, and uniform habitat", "High genetic similarity, low endemism, and low threat", "High species richness, high endemism, and significant threat"], "answer": "High species richness, high endemism, and significant threat"}, {"week": 6, "q": "Which barrier acts before fertilization?", "options": ["Hybrid sterility", "Hybrid breakdown", "Embryo inviability", "Temporal isolation"], "answer": "Temporal isolation"}, {"week": 6, "q": "Allelopathy occurs when:", "options": ["Animals form groups to avoid predators", "One organism releases chemicals that inhibit another", "Species shift upward in altitude because of warming", "Adjacent populations interbreed around a barrier"], "answer": "One organism releases chemicals that inhibit another"}, {"week": 6, "q": "Gamma diversity refers to:", "options": ["Diversity within one wetland", "Total diversity across a larger region", "Evenness of individuals among species", "Fitness differences between populations"], "answer": "Total diversity across a larger region"}, {"week": 6, "q": "What does biodiversity mean?", "options": ["Only the number of large animals in a forest", "Only the number of protected areas in a landscape", "Only variation in climate and soil", "The variety of life within species, among species, and among ecosystems"], "answer": "The variety of life within species, among species, and among ecosystems"}, {"week": 6, "q": "What is speciation?", "options": ["The seasonal movement of individuals between habitats", "The increase in population size within one area", "The grouping of organisms according to body colour", "The splitting of one lineage into two or more independently evolving species"], "answer": "The splitting of one lineage into two or more independently evolving species"}, {"week": 6, "q": "Which idea best describes a species as a scientific concept?", "options": ["A fixed sentence that applies equally to every organism", "A category based only on visible form", "A flexible tool that may emphasize interbreeding, form, ancestry, or niche", "A group that must always be geographically isolated"], "answer": "A flexible tool that may emphasize interbreeding, form, ancestry, or niche"}, {"week": 7, "q": "Simple random sampling gives:", "options": ["Larger units a higher chance of selection", "Every sampling unit an equal chance of selection", "Only remote areas a chance of selection", "Every kth unit after a fixed start without randomness"], "answer": "Every sampling unit an equal chance of selection"}, {"week": 7, "q": "Stratified sampling is especially useful when:", "options": ["The whole landscape is uniform", "Animal density varies across habitat types", "Complete census is always possible", "Sampling units cannot be mapped"], "answer": "Animal density varies across habitat types"}, {"week": 7, "q": "Which is an example of equipment bias?", "options": ["Missed detections due to low observer skill", "Faulty calibration of a measuring device", "Dense vegetation hiding animals", "Unrealistic movement assumptions in a model"], "answer": "Faulty calibration of a measuring device"}, {"week": 7, "q": "Bias in wildlife monitoring means:", "options": ["Random scatter around a true value", "Systematic deviation from the true value", "Higher cost of data collection", "Larger sample size than required"], "answer": "Systematic deviation from the true value"}, {"week": 7, "q": "In camera-trap based tiger estimation, individual tigers can be identified by:", "options": ["Herd size", "Nesting banks", "Unique stripe patterns", "Flowering season"], "answer": "Unique stripe patterns"}, {"week": 7, "q": "Which pair represents losses from a population?", "options": ["Natality and immigration", "Births and recruitment", "Mortality and emigration", "Density and dispersal"], "answer": "Mortality and emigration"}, {"week": 7, "q": "A population in wildlife studies is best understood as which of the following?", "options": ["All species living in a habitat during one season", "Individuals of the same species in a defined area that are capable of interbreeding", "All animals counted during a field survey", "Individuals of different species using the same corridor"], "answer": "Individuals of the same species in a defined area that are capable of interbreeding"}, {"week": 7, "q": "Which pair represents gains to a population?", "options": ["Births and immigration", "Deaths and emigration", "Births and deaths", "Immigration and emigration"], "answer": "Births and immigration"}, {"week": 7, "q": "PPS sampling means:", "options": ["Larger sampling units receive a higher chance of selection", "Every unit has the same chance regardless of size", "Only point transects are used", "Animals are removed after each capture"], "answer": "Larger sampling units receive a higher chance of selection"}, {"week": 7, "q": "Sampling intensity is calculated as:", "options": ["Total animals divided by total area", "Sample units divided by total population units", "Marked animals divided by recaptured animals", "Detection distance divided by transect length"], "answer": "Sample units divided by total population units"}, {"week": 8, "q": "Which statement best describes conservation genetics?", "options": ["It studies only visible animal behaviour in protected areas", "It replaces habitat management with capture breeding", "It applies genetic tools to biodiversity protection", "It measures only the age structure of populations"], "answer": "It applies genetic tools to biodiversity protection"}, {"week": 8, "q": "What is allele frequency?", "options": ["A fixed number of individuals in a population", "A measure of animal movement across habitats", "A record of all chromosomes in one cell", "The proportion of a particular allele among all copies of that gene"], "answer": "The proportion of a particular allele among all copies of that gene"}, {"week": 8, "q": "What are chromosomes?", "options": ["Short-term environmental pressures on wildlife", "Long DNA-protein structures carrying many genes", "Behavioural adaptations learned during life", "Statistical outputs of viability models"], "answer": "Long DNA-protein structures carrying many genes"}, {"week": 8, "q": "What does fitness mean in evolutionary terms?", "options": ["Physical strength or speed alone", "Relative reproductive success across generations", "Ability to occupy the largest territory", "Ability to avoid all competition"], "answer": "Relative reproductive success across generations"}, {"week": 8, "q": "What is the founder effect?", "options": ["A selection process where predators remove weak individuals", "A condition where all individuals have identical chromosomes", "A disease caused by increased heterozygosity", "A new population starting from a few individuals and carrying only part of the original genetic diversity"], "answer": "A new population starting from a few individuals and carrying only part of the original genetic diversity"}, {"week": 8, "q": "Which perspective asks what external pressures made a population small?", "options": ["Small population paradigm", "Genetic rescue model", "Declining population paradigm", "Outbreeding enhancement model"], "answer": "Declining population paradigm"}, {"week": 8, "q": "Which inheritance pattern occurs when both alleles are fully expressed?", "options": ["Complete dominance", "Incomplete dominance", "Codominance", "Segregation"], "answer": "Codominance"}, {"week": 8, "q": "Which statement correctly describes phenotype?", "options": ["It is the hidden genetic constitution of an organism", "It is the observable expression of traits", "It is the total genetic variation of a population", "It is the location of a gene on a chromosome"], "answer": "It is the observable expression of traits"}, {"week": 8, "q": "What is the Allee effect?", "options": ["A condition where large populations always decline", "A process where all mutations improve fitness", "A method for calculating allele frequency", "Lower survival or reproduction in very small populations because density is too low"], "answer": "Lower survival or reproduction in very small populations because density is too low"}, {"week": 8, "q": "What is genetic rescue?", "options": ["A method of counting chromosomes under a microscope", "Introduction of new genetic material into small, isolated populations to reduce inbreeding depression and increase fitness", "Removal of all predators from a protected area", "Use of only visually rare animals for captive breeding"], "answer": "Introduction of new genetic material into small, isolated populations to reduce inbreeding depression and increase fitness"}];
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function normalize(s){return String(s||"").trim().toLowerCase().replace(/\s+/g," ").replace(/[\u2019']/g,"'")}
const questions=shuffle(quizData),form=document.getElementById("quizForm");
document.getElementById("metaLine").textContent=`${questions.length} questions loaded. Questions and options are shuffled on each refresh.`;
function escapeHtml(str){return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function render(){form.innerHTML="";questions.forEach((item,idx)=>{const card=document.createElement("div");card.className="question-card";const opts=shuffle(item.options);
card.innerHTML=`<div class="qtop"><p class="qtitle">${idx+1}) ${escapeHtml(item.q)}</p><div class="week-badge">Week ${item.week}</div></div><div class="options">${opts.map(opt=>`<label class="opt"><input type="radio" name="q${idx}" value="${escapeHtml(opt)}"><span>${escapeHtml(opt)}</span></label>`).join("")}</div><div class="result" id="r${idx}"></div>`;form.appendChild(card)})}
function submitQuiz(){let score=0,correct=0,wrong=0,blank=0;questions.forEach((item,idx)=>{const res=document.getElementById(`r${idx}`),selected=document.querySelector(`input[name="q${idx}"]:checked`);
if(!selected){blank++;res.textContent=`❌ Not Answered | Correct: ${item.answer}`;res.className="result wrong"}
else if(normalize(selected.value)===normalize(item.answer)){score++;correct++;res.textContent="✅ Correct";res.className="result correct"}
else{wrong++;res.textContent=`❌ Wrong | Correct: ${item.answer}`;res.className="result wrong"}});
document.getElementById("scoreBox").innerHTML=`Final Score: ${score} / ${questions.length} <span class="scoredetails">Correct: ${correct} &nbsp;|&nbsp; Wrong: ${wrong} &nbsp;|&nbsp; Not Answered: ${blank}</span>`;
window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"})}
function resetQuiz(){render();document.getElementById("scoreBox").textContent="Submit the quiz to see your score.";window.scrollTo({top:0,behavior:"smooth"})}
render();
</script></body></html>
