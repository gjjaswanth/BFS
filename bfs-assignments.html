<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 Biodiversity for Sustainability Assignments</title><style>
:root{--bg:#f4f6f8;--card:#fff;--text:#111827;--muted:#6b7280;--border:#e5e7eb;--shadow:0 4px 12px rgba(0,0,0,.05);--green:#118a3a;--red:#c0262d;--button:#111827}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:1500px;margin:0 auto;padding:24px 18px 40px}header{text-align:center;padding:6px 0 20px}h1{font-size:clamp(30px,3.8vw,52px);line-height:1.1;margin:8px 0 6px;font-weight:800;color:#000}.subtitle{margin:0 auto;max-width:880px;color:var(--muted);font-size:14px}.toolbar{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:18px 0 24px}
button,.link-btn{appearance:none;border:0;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn-primary{background:var(--button);color:#fff}.btn-secondary{background:#e5e7eb;color:#111827}.meta{text-align:center;margin:0 0 18px;color:var(--muted);font-size:14px}
form{display:grid;gap:18px}.question-card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);border:1px solid #f0f0f0;padding:18px 18px 14px}.qtop{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:10px}.qtitle{font-size:18px;line-height:1.55;margin:0;font-weight:500}.week-badge{flex:0 0 auto;font-size:12px;background:#eef2ff;color:#3730a3;padding:6px 10px;border-radius:999px;font-weight:700}
.options{display:grid;gap:8px;margin-top:4px}label.opt{display:flex;gap:10px;align-items:flex-start;font-size:16px;line-height:1.45;cursor:pointer}label.opt input{margin-top:4px;transform:scale(1.05)}.result{margin-top:12px;font-weight:700;min-height:24px;font-size:15px}.correct{color:var(--green)}.wrong{color:var(--red)}.scorebox{margin-top:20px;padding:16px 18px;background:#fff;border:1px solid #e5e7eb;border-radius:14px;box-shadow:var(--shadow);font-size:18px;font-weight:800;text-align:center}.scoredetails{display:block;margin-top:8px;font-size:14px;color:var(--muted);font-weight:600}.sticky-submit{position:sticky;bottom:14px;z-index:5;display:flex;justify-content:center;margin-top:10px}.sticky-submit button{box-shadow:0 10px 24px rgba(0,0,0,.12)}
@media(max-width:700px){.qtitle{font-size:17px}label.opt{font-size:15px}.question-card{padding:16px 14px 12px}}
</style></head>
<body><div class="wrap"><header><h1>2026 Biodiversity for Sustainability Assignments</h1><p class="subtitle">Interactive quiz with shuffled questions, shuffled options, instant scoring, and correct/wrong feedback after submission.</p></header>
<div class="toolbar"><a class="link-btn btn-secondary" href="./index.html">Home</a><button class="btn-primary" type="button" onclick="submitQuiz()">Submit</button><button class="btn-secondary" type="button" onclick="resetQuiz()">Reset</button></div>
<div class="meta" id="metaLine"></div><form id="quizForm"></form><div class="sticky-submit"><button class="btn-primary" type="button" onclick="submitQuiz()">Submit</button></div><div class="scorebox" id="scoreBox">Submit the quiz to see your score.</div></div>
<script>
const quizData=[{"week": 1, "q": "Which of the following is included in invisible biodiversity?", "type": "single", "options": ["Mountains and rivers", "Genes, microbes, fungi, soil life, and ecological processes", "Only large animals hidden in forests", "Only plants growing below tree cover"], "answer": "Genes, microbes, fungi, soil life, and ecological processes"}, {"week": 1, "q": "What does the term “distribution” refer to in ecology?", "type": "single", "options": ["How organisms reproduce", "How organisms compete", "Where organisms occur", "How organisms obtain food"], "answer": "Where organisms occur"}, {"week": 1, "q": "How do wetlands contribute to water security?", "type": "single", "options": ["By increasing fossil fuel availability", "By storing and filtering water", "By eliminating the need for forests", "By replacing all human water management"], "answer": "By storing and filtering water"}, {"week": 1, "q": "Which statement best describes a habitat?", "type": "single", "options": ["A visually attractive natural location", "A fixed geographical point where a species was once recorded", "A place containing only physical conditions", "A functionally suitable setting in which an organism can live"], "answer": "A functionally suitable setting in which an organism can live"}, {"week": 1, "q": "Why is ecology not identical to environmental concern?", "type": "single", "options": ["Ecology rejects ethical thinking completely", "Environmental concern is based only on laboratory experiments", "Ecology deals only with non-living matter", "Ecology provides scientific evidence and explanation, while concern is a social or ethical response"], "answer": "Ecology provides scientific evidence and explanation, while concern is a social or ethical response"}, {"week": 1, "q": "Which of the following is an example of a community interaction?", "type": "single", "options": ["Rainfall entering the soil", "Temperature changing across seasons", "Predation between two species", "A rock weathering over time"], "answer": "Predation between two species"}, {"week": 1, "q": "What is the biosphere?", "type": "single", "options": ["A single habitat suitable for one species", "The global sum of life and living systems", "A local group of interacting populations", "A laboratory model of ecological processes"], "answer": "The global sum of life and living systems"}, {"week": 1, "q": "A community in ecology means:", "type": "single", "options": ["Populations of different species living together and interacting", "Individuals of one species competing in one location", "Physical conditions without living organisms", "A single organism responding to environmental stress"], "answer": "Populations of different species living together and interacting"}, {"week": 1, "q": "What are ecosystem services?", "type": "single", "options": ["The benefits people obtain from ecosystems", "The laws created to protect forests", "The instruments used for field surveys", "The number of species in an area"], "answer": "The benefits people obtain from ecosystems"}, {"week": 1, "q": "At the organism level, ecology focuses on:", "type": "single", "options": ["A single individual living being", "All ecosystems on Earth", "Only non-living environmental conditions", "The total number of species in a biome"], "answer": "A single individual living being"}, {"week": 2, "q": "What does functional diversity refer to?", "type": "single", "options": ["The total market value of ecosystem products", "Different species performing different ecological roles", "The number of development projects in a region", "The use of one indicator for multiple systems"], "answer": "Different species performing different ecological roles"}, {"week": 2, "q": "What is a trade-off in sustainability analysis?", "type": "single", "options": ["A situation where real benefits and real harms occur together", "A decision that supports all three pillars equally", "A case where ecological damage has no social effect", "A method for avoiding evidence-based assessment"], "answer": "A situation where real benefits and real harms occur together"}, {"week": 2, "q": "What is the main role of regulating services?", "type": "single", "options": ["Reducing risks and stabilising conditions through ecological processes", "Supplying only direct material goods", "Replacing social indicators in development planning", "Measuring ecosystem value through one composite score"], "answer": "Reducing risks and stabilising conditions through ecological processes"}, {"week": 2, "q": "What does environmental sustainability primarily involve?", "type": "single", "options": ["Protecting ecological processes, biodiversity, resources, and resilience", "Increasing production without measuring ecological effects", "Ensuring compensation after environmental damage", "Treating nature only as a source of market products"], "answer": "Protecting ecological processes, biodiversity, resources, and resilience"}, {"week": 2, "q": "Why can wetlands be understood as natural infrastructure?", "type": "single", "options": ["They store water, slow flows, filter contaminants, and support habitat", "They are empty spaces suitable for quick conversion", "They only provide scenic value to nearby residents", "Their services can always be fully replaced by drainage systems"], "answer": "They store water, slow flows, filter contaminants, and support habitat"}, {"week": 2, "q": "What helped many early societies understand environmental limits?", "type": "single", "options": ["Direct ecological feedback from land, water, seasons, and resource use", "International environmental agreements", "Industrial monitoring systems", "Modern composite indicators"], "answer": "Direct ecological feedback from land, water, seasons, and resource use"}, {"week": 2, "q": "What should a good sustainability indicator do?", "type": "single", "options": ["Count whatever is easiest to measure", "Replace interpretation with numerical certainty", "Ignore context to allow simple comparison", "Represent important realities, be understandable, and support action"], "answer": "Represent important realities, be understandable, and support action"}, {"week": 2, "q": "What made industrialization different from earlier forms of development?", "type": "single", "options": ["It removed the need for natural resources", "It made ecological damage immediately visible everywhere", "It reduced the distance between consumption and resource sources", "It increased speed, scale, and distance, making damage easier to hide"], "answer": "It increased speed, scale, and distance, making damage easier to hide"}, {"week": 2, "q": "What does an ecological threshold indicate?", "type": "single", "options": ["A point where social benefits become impossible to measure", "A market price at which ecosystem services become profitable", "A limit beyond which ecological change may become unsafe or difficult to reverse", "A planning method that removes uncertainty from sustainability decisions"], "answer": "A limit beyond which ecological change may become unsafe or difficult to reverse"}, {"week": 2, "q": "What does natural capital accounting emphasise?", "type": "single", "options": ["Nature should be valued only when it produces goods for markets", "Forests, soils, water systems, wetlands, and biodiversity have real value", "Economic decisions should ignore ecological functions", "Market price always captures the full value of ecosystems"], "answer": "Forests, soils, water systems, wetlands, and biodiversity have real value"}, {"week": 3, "q": "Why do specialist species often decline earlier under ecological pressure?", "type": "single", "options": ["They can easily shift food and habitat use", "They depend on narrow habitat, food, or breeding conditions", "They reproduce faster than generalist species", "They are always disturbance-tolerant"], "answer": "They depend on narrow habitat, food, or breeding conditions"}, {"week": 3, "q": "What does habitat fragmentation involve?", "type": "single", "options": ["Only pollution of a single water body", "Breaking a natural landscape into smaller isolated parcels within a human-dominated matrix", "Complete removal of all species from a region", "Natural growth of continuous forest corridors"], "answer": "Breaking a natural landscape into smaller isolated parcels within a human-dominated matrix"}, {"week": 3, "q": "Why is soil erosion a habitat degradation problem?", "type": "single", "options": ["It adds nutrients to all rivers", "It increases topsoil depth", "It removes biologically active topsoil and can cause sedimentation in aquatic habitats", "It prevents all landslides permanently"], "answer": "It removes biologically active topsoil and can cause sedimentation in aquatic habitats"}, {"week": 3, "q": "What are ghost nets?", "type": "single", "options": ["Nets used to protect wildlife from predators", "Lost, abandoned, or discarded fishing nets that continue trapping marine life", "Nets used only in freshwater farming", "Natural coral structures that trap plastic"], "answer": "Lost, abandoned, or discarded fishing nets that continue trapping marine life"}, {"week": 3, "q": "Why can a renewable biological resource become effectively non-renewable?", "type": "single", "options": ["Because all renewable resources stop reproducing naturally", "Because legal use automatically destroys all species", "Because removal may exceed the resource’s capacity to regenerate", "Because only non-living resources can be harvested"], "answer": "Because removal may exceed the resource’s capacity to regenerate"}, {"week": 3, "q": "What is a native species?", "type": "single", "options": ["A species introduced for human use", "A species that survives only in captivity", "A species that occurs naturally in a region and is part of its long-term ecological community", "Any species that spreads aggressively"], "answer": "A species that occurs naturally in a region and is part of its long-term ecological community"}, {"week": 3, "q": "What is the key ecological principle behind sustainable use?", "type": "single", "options": ["Removal may exceed regeneration if demand is high", "Removal must remain below regeneration capacity", "Any legal extraction is sustainable", "Biological renewal is unaffected by habitat quality"], "answer": "Removal must remain below regeneration capacity"}, {"week": 3, "q": "Why is light pollution ecologically significant?", "type": "single", "options": ["It affects only electricity consumption", "It improves all nocturnal behaviour", "It alters natural day-night conditions, orientation, timing, and activity patterns", "It prevents all insect movement"], "answer": "It alters natural day-night conditions, orientation, timing, and activity patterns"}, {"week": 3, "q": "Why are energy systems described as having ecological footprints?", "type": "single", "options": ["They require only sunlight and wind", "They require land, water, materials, mines, dams, roads, drilling, or transmission infrastructure", "They never cause habitat change", "They affect only urban areas"], "answer": "They require land, water, materials, mines, dams, roads, drilling, or transmission infrastructure"}, {"week": 3, "q": "What is overexploitation?", "type": "single", "options": ["Any use of biological resources", "Use of biological resources beyond their capacity to regenerate", "Complete protection of all species from use", "Natural increase in wildlife populations"], "answer": "Use of biological resources beyond their capacity to regenerate"}, {"week": 4, "q": "What does overexploitation mean?", "type": "single", "options": ["The movement of species into new habitats", "Taking biological resources faster than nature can replace them", "The recycling of nutrients by decomposers", "The restoration of extinct species through cloning"], "answer": "Taking biological resources faster than nature can replace them"}, {"week": 4, "q": "What is the classical period used for calculating climate averages?", "type": "single", "options": ["5 years", "10 years", "20 years", "30 years"], "answer": "30 years"}, {"week": 4, "q": "Why are specialist species especially vulnerable to climate change?", "type": "single", "options": ["They always have large home ranges", "They reproduce faster than generalists", "They have narrow ecological requirements and few alternatives when conditions change", "They are unaffected by changes in food quality"], "answer": "They have narrow ecological requirements and few alternatives when conditions change"}, {"week": 4, "q": "Under Shelford’s Law of Tolerance, what happens when an ecological condition falls outside an organism’s coping capacity?", "type": "single", "options": ["The population reaches its optimum level", "The species immediately adapts genetically", "The species shifts into its most suitable range", "The population drops to zero"], "answer": "The population drops to zero"}, {"week": 4, "q": "What does the IUCN Red List category Extinct in the Wild mean?", "type": "single", "options": ["The species has many stable wild populations", "The species has no known individuals anywhere", "The species survives only in zoos, seed banks, or other human-managed settings", "The species is common but declining slowly"], "answer": "The species survives only in zoos, seed banks, or other human-managed settings"}, {"week": 4, "q": "Which set correctly identifies major climatic changes affecting biodiversity?", "type": "single", "options": ["Soil erosion, mining, hunting, and disease", "Rising temperature, changing rainfall patterns, more frequent extremes, and shifting seasons", "Urbanisation, overgrazing, logging, and fishing", "Mutation, migration, predation, and reproduction"], "answer": "Rising temperature, changing rainfall patterns, more frequent extremes, and shifting seasons"}, {"week": 4, "q": "What is genetic rescue?", "type": "single", "options": ["Introducing individuals from another population to increase genetic diversity and reduce inbreeding problems", "Removing all predators from a protected area", "Converting a dryland into agricultural land", "Increasing pollutant concentration in predators"], "answer": "Introducing individuals from another population to increase genetic diversity and reduce inbreeding problems"}, {"week": 4, "q": "What is eutrophication?", "type": "single", "options": ["Rapid algal growth triggered by excess nutrients, leading to oxygen decline and harm to aquatic life", "Movement of animals toward cooler latitudes", "Recovery of forests after fire", "A process of genetic rescue in small populations"], "answer": "Rapid algal growth triggered by excess nutrients, leading to oxygen decline and harm to aquatic life"}, {"week": 4, "q": "What does the Allee effect describe?", "type": "single", "options": ["Increased survival when nutrient runoff is high", "Reduced shell-building due to seawater chemistry", "Faster adaptation in fragmented landscapes", "Failure of survival or reproduction when population size or density becomes too low"], "answer": "Failure of survival or reproduction when population size or density becomes too low"}, {"week": 4, "q": "In a nutrient cycle, what role do decomposers perform?", "type": "single", "options": ["They prevent nutrients from entering food webs", "They convert all nutrients into fossil fuels", "They remove producers from ecosystems", "They break down dead material and wastes, returning nutrients to the nutrient pool"], "answer": "They break down dead material and wastes, returning nutrients to the nutrient pool"}];
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function normalize(s){return String(s||"").trim().toLowerCase().replace(/\s+/g," ").replace(/[\u2019']/g,"'")}
const questions=shuffle(quizData),form=document.getElementById("quizForm");
document.getElementById("metaLine").textContent=`${questions.length} questions loaded. Questions and options are shuffled on each refresh.`;
function escapeHtml(str){return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function render(){form.innerHTML="";questions.forEach((item,idx)=>{const card=document.createElement("div");card.className="question-card";const opts=shuffle(item.options);card.innerHTML=`<div class="qtop"><p class="qtitle">${idx+1}) ${escapeHtml(item.q)}</p><div class="week-badge">Week ${item.week}</div></div><div class="options">${opts.map(opt=>`<label class="opt"><input type="radio" name="q${idx}" value="${escapeHtml(opt)}"><span>${escapeHtml(opt)}</span></label>`).join("")}</div><div class="result" id="r${idx}"></div>`;form.appendChild(card)})}
function submitQuiz(){let score=0,correct=0,wrong=0,blank=0;questions.forEach((item,idx)=>{const res=document.getElementById(`r${idx}`),selected=document.querySelector(`input[name="q${idx}"]:checked`);if(!selected){blank++;res.textContent=`❌ Not Answered | Correct: ${item.answer}`;res.className="result wrong"}else if(normalize(selected.value)===normalize(item.answer)){score++;correct++;res.textContent="✅ Correct";res.className="result correct"}else{wrong++;res.textContent=`❌ Wrong | Correct: ${item.answer}`;res.className="result wrong"}});document.getElementById("scoreBox").innerHTML=`Final Score: ${score} / ${questions.length} <span class="scoredetails">Correct: ${correct} &nbsp;|&nbsp; Wrong: ${wrong} &nbsp;|&nbsp; Not Answered: ${blank}</span>`;window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"})}
function resetQuiz(){render();document.getElementById("scoreBox").textContent="Submit the quiz to see your score.";window.scrollTo({top:0,behavior:"smooth"})}
render();
</script></body></html>
