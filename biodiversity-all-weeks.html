e biosphere?", "options": ["A single habitat suitable for one species", "The global sum of life and living systems", "A local group of interacting populations", "A laboratory model of ecological processes"], "answer": "The global sum of life and living systems"}, {"week": 1, "q": "A community in ecology means:", "options": ["Populations of different species living together and interacting", "Individuals of one species competing in one location", "Physical conditions without living organisms", "A single organism responding to environmental stress"], "answer": "Populations of different species living together and interacting"}, {"week": 1, "q": "What are ecosystem services?", "options": ["The benefits people obtain from ecosystems", "The laws created to protect forests", "The instruments used for field surveys", "The number of species in an area"], "answer": "The benefits people obtain from ecosystems"}, {"week": 1, "q": "At the organism level, ecology focuses on:", "options": ["A single individual living being", "All ecosystems on Earth", "Only non-living environmental conditions", "The total number of species in a biome"], "answer": "A single individual living being"}, {"week": 2, "q": "What does functional diversity refer to?", "options": ["The total market value of ecosystem products", "Different species performing different ecological roles", "The number of development projects in a region", "The use of one indicator for multiple systems"], "answer": "Different species performing different ecological roles"}, {"week": 2, "q": "What is a trade-off in sustainability analysis?", "options": ["A situation where real benefits and real harms occur together", "A decision that supports all three pillars equally", "A case where ecological damage has no social effect", "A method for avoiding evidence-based assessment"], "answer": "A situation where real benefits and real harms occur together"}, {"week": 2, "q": "What is the main role of regulating services?", "options": ["Reducing risks and stabilising conditions through ecological processes", "Supplying only direct material goods", "Replacing social indicators in development planning", "Measuring ecosystem value through one composite score"], "answer": "Reducing risks and stabilising conditions through ecological processes"}, {"week": 2, "q": "What does environmental sustainability primarily involve?", "options": ["Protecting ecological processes, biodiversity, resources, and resilience", "Increasing production without measuring ecological effects", "Ensuring compensation after environmental damage", "Treating nature only as a source of market products"], "answer": "Protecting ecological processes, biodiversity, resources, and resilience"}, {"week": 2, "q": "Why can wetlands be understood as natural infrastructure?", "options": ["They store water, slow flows, filter contaminants, and support habitat", "They are empty spaces suitable for quick conversion", "They only provide scenic value to nearby residents", "Their services can always be fully replaced by drainage systems"], "answer": "They store water, slow flows, filter contaminants, and support habitat"}, {"week": 2, "q": "What helped many early societies understand environmental limits?", "options": ["Direct ecological feedback from land, water, seasons, and resource use", "International environmental agreements", "Industrial monitoring systems", "Modern composite indicators"], "answer": "Direct ecological feedback from land, water, seasons, and resource use"}, {"week": 2, "q": "What should a good sustainability indicator do?", "options": ["Count whatever is easiest to measure", "Replace interpretation with numerical certainty", "Ignore context to allow simple comparison", "Represent important realities, be understandable, and support action"], "answer": "Represent important realities, be understandable, and support action"}, {"week": 2, "q": "What made industrialization different from earlier forms of development?", "options": [ pecies now", "The benefit of keeping biodiversity available for possible future uses", "The cost of removing biodiversity from markets"], "answer": "The benefit of keeping biodiversity available for possible future uses"}, {"week": 5, "q": "What are examples of non-timber forest products?", "options": ["Fruits, nuts, resins, medicinal plants, bamboo, and fibres", "Roads, drains, fences, and bridges", "Coal, cement, steel, and petroleum", "Cars, buildings, markets, and pipelines"], "answer": "Fruits, nuts, resins, medicinal plants, bamboo, and fibres"}, {"week": 5, "q": "What is microclimate regulation by vegetation?", "options": ["Reducing heat stress by shade, lower surface temperatures, and humidity influence", "Increasing heat stress by removing tree cover", "Preventing all seasonal variation in climate", "Replacing water regulation with pest regulation"], "answer": "Reducing heat stress by shade, lower surface temperatures, and humidity influence"}, {"week": 5, "q": "Which set represents cultural services of biodiversity?", "options": ["Flood control, pollination, soil structure, and carbon storage", "Recreation, inspiration, education, heritage, and shared public spaces", "Crop raiding, livestock loss, property damage, and fear", "Compensation, insurance, fences, and early warnings"], "answer": "Recreation, inspiration, education, heritage, and shared public spaces"}, {"week": 5, "q": "What is a major limitation of fortress thinking in conservation?", "options": ["Not all biodiversity can be isolated from people", "It gives too much importance to shared landscapes", "It ignores the need for protected areas altogether", "It assumes people and wildlife must always interact directly"], "answer": "Not all biodiversity can be isolated from people"}, {"week": 5, "q": "How does biodiversity help regulate water in a landscape?", "options": ["By stopping rainfall from entering the soil", "By increasing surface runoff in simplified landscapes", "By influencing infiltration, storage, and runoff through vegetation, roots, and living soils", "By eliminating wetlands from human-used areas"], "answer": "By influencing infiltration, storage, and runoff through vegetation, roots, and living soils"}, {"week": 5, "q": "Which factor can make coexistence difficult?", "options": ["Perfectly equal sharing of all conservation costs", "Inadequate planning of roads, settlements, farms, or infrastructure", "Complete absence of ecological uncertainty", "Guaranteed support from all institutions"], "answer": "Inadequate planning of roads, settlements, farms, or infrastructure"}, {"week": 5, "q": "How can biodiversity support physical health?", "options": ["By increasing polluted water flow", "By removing all disease risk permanently", "By replacing all healthcare systems", "By filtering pollutants, improving air and water quality, and supporting stable ecological regulation"], "answer": "By filtering pollutants, improving air and water quality, and supporting stable ecological regulation"}, {"week": 6, "q": "Which species concept defines species mainly by niche, resources, and environmental conditions used?", "options": ["Evolutionary species concept", "Ecological species concept", "Biological species concept", "Morphological species concept"], "answer": "Ecological species concept"}, {"week": 6, "q": "Habitat quality depends mainly on:", "options": ["Legal status alone", "Whether the habitat appears on a map", "Food, water, shelter, breeding sites, and low disturbance", "Whether only one species is present"], "answer": "Food, water, shelter, breeding sites, and low disturbance"}, {"week": 6, "q": "Genetic diversity refers to:", "options": ["Variation in hereditary information among individuals and populations", "Difference in species composition between two ecosystems", "Number of habitats across a landscape", "Number of visible traits in a field guide"], "answer": "Variation in hereditary information among individuals and populations"}, {"week": 6, ?", "options": ["A fixed sentence that applies equally to every organism", "A category based only on visible form", "A flexible tool that may emphasize interbreeding, form, ancestry, or niche", "A group that must always be geographically isolated"], "answer": "A flexible tool that may emphasize interbreeding, form, ancestry, or niche"}, {"week": 7, "q": "Simple random sampling gives:", "options": ["Larger units a higher chance of selection", "Every sampling unit an equal chance of selection", "Only remote areas a chance of selection", "Every kth unit after a fixed start without randomness"], "answer": "Every sampling unit an equal chance of selection"}, {"week": 7, "q": "Stratified sampling is especially useful when:", "options": ["The whole landscape is uniform", "Animal density varies across habitat types", "Complete census is always possible", "Sampling units cannot be mapped"], "answer": "Animal density varies across habitat types"}, {"week": 7, "q": "Which is an example of equipment bias?", "options": ["Missed detections due to low observer skill", "Faulty calibration of a measuring device", "Dense vegetation hiding animals", "Unrealistic movement assumptions in a model"], "answer": "Faulty calibration of a measuring device"}, {"week": 7, "q": "Bias in wildlife monitoring means:", "options": ["Random scatter around a true value", "Systematic deviation from the true value", "Higher cost of data collection", "Larger sample size than required"], "answer": "Systematic deviation from the true value"}, {"week": 7, "q": "In camera-trap based tiger estimation, individual tigers can be identified by:", "options": ["Herd size", "Nesting banks", "Unique stripe patterns", "Flowering season"], "answer": "Unique stripe patterns"}, {"week": 7, "q": "Which pair represents losses from a population?", "options": ["Natality and immigration", "Births and recruitment", "Mortality and emigration", "Density and dispersal"], "answer": "Mortality and emigration"}, {"week": 7, "q": "A population in wildlife studies is best understood as which of the following?", "options": ["All species living in a habitat during one season", "Individuals of the same species in a defined area that are capable of interbreeding", "All animals counted during a field survey", "Individuals of different species using the same corridor"], "answer": "Individuals of the same species in a defined area that are capable of interbreeding"}, {"week": 7, "q": "Which pair represents gains to a population?", "options": ["Births and immigration", "Deaths and emigration", "Births and deaths", "Immigration and emigration"], "answer": "Births and immigration"}, {"week": 7, "q": "PPS sampling means:", "options": ["Larger sampling units receive a higher chance of selection", "Every unit has the same chance regardless of size", "Only point transects are used", "Animals are removed after each capture"], "answer": "Larger sampling units receive a higher chance of selection"}, {"week": 7, "q": "Sampling intensity is calculated as:", "options": ["Total animals divided by total area", "Sample units divided by total population units", "Marked animals divided by recaptured animals", "Detection distance divided by transect length"], "answer": "Sample units divided by total population units"}, {"week": 8, "q": "Which statement best describes conservation genetics?", "options": ["It studies only visible animal behaviour in protected areas", "It replaces habitat management with capture breeding", "It applies genetic tools to biodiversity protection", "It measures only the age structure of populations"], "answer": "It applies genetic tools to biodiversity protection"}, {"week": 8, "q": "What is allele frequency?", "options": ["A fixed number of individuals in a population", "A measure of animal movement across habitats", "A record of all chromosomes in one cell", "The proportion of a particular allele among all copies of that gene"], "answer": "The proportion of a particular allele among all copies tions always decline", "A process where all mutations improve fitness", "A method for calculating allele frequency", "Lower survival or reproduction in very small populations because density is too low"], "answer": "Lower survival or reproduction in very small populations because density is too low"}, {"week": 8, "q": "What is genetic rescue?", "options": ["A method of counting chromosomes under a microscope", "Introduction of new genetic material into small, isolated populations to reduce inbreeding depression and increase fitness", "Removal of all predators from a protected area", "Use of only visually rare animals for captive breeding"], "answer": "Introduction of new genetic material into small, isolated populations to reduce inbreeding depression and increase fitness"}];

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function normalize(s){
  return String(s||"").trim().toLowerCase()
    .replace(/\s+/g," ").replace(/[\u2019']/g,"'");
}

const questions=shuffle(quizData);
const form=document.getElementById("quizForm");

const weekCounts=questions.reduce((acc,q)=>{
  acc[q.week]=(acc[q.week]||0)+1;
  return acc;
},{});

document.getElementById("metaLine").textContent =
  `${questions.length} questions loaded from Weeks ${Math.min(...questions.map(q=>q.week))}–${Math.max(...questions.map(q=>q.week))}. Questions and options are shuffled.`;

function escapeHtml(str){
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function render(){
  form.innerHTML="";
  questions.forEach((item,idx)=>{
    const card=document.createElement("div");
    card.className="question-card";
    const opts=shuffle(item.options);

    card.innerHTML=`
      <div class="qtop">
        <p class="qtitle">${idx+1}) ${escapeHtml(item.q)}</p>
        <div class="week-badge">Week ${item.week}</div>
      </div>
      <div class="options">
        ${opts.map(opt=>`
          <label class="opt">
            <input type="radio" name="q${idx}" value="${escapeHtml(opt)}">
            <span>${escapeHtml(opt)}</span>
          </label>`).join("")}
      </div>
      <div class="result" id="r${idx}"></div>`;
    form.appendChild(card);
  });
}

  questions.forEach((item,idx)=>{
    const res=document.getElementById(`r${idx}`);
    const selected=document.querySelector(`input[name="q${idx}"]:checked`);

    if(!selected){
      blank++;
      res.textContent=`❌ Not Answered | Correct: ${item.answer}`;
      res.className="result wrong";
    }else if(normalize(selected.value)===normalize(item.answer)){
      score++; correct++;
      res.textContent="✅ Correct";
      res.className="result correct";
    }else{
      wrong++;
      res.textContent=`❌ Wrong | Correct: ${item.answer}`;
      res.className="result wrong";
    }
  });

  document.getElementById("scoreBox").innerHTML=
    `Final Score: ${score} / ${questions.length}
     <span class="scoredetails">
       Correct: ${correct} &nbsp;|&nbsp; Wrong: ${wrong} &nbsp;|&nbsp; Not Answered: ${blank}
     </span>`;

  window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}

function resetQuiz(){
  questions.splice(0,questions.length,...shuffle(quizData));
  render();
  document.getElementById("scoreBox").textContent="Submit the quiz to see your score.";
  window.scrollTo({top:0,behavior:"smooth"});
}

render();
</script>
</body>
</html>
